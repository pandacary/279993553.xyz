    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft Yahei",sans-serif}
        body{background:#f9f7f4;color:#3a3630}
        nav{background-image:url('https://images.unsplash.com/photo-154178909411-f56ce539ca9a');background-size:cover;background-position:center;background-color:rgba(255,255,255,0.75);background-blend-mode:overlay;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999;border-bottom:1px solid #eee}
        .logo{font-size:1.4rem;color:#8b5a2b;text-decoration:none;font-weight:600}
        .nav-container{display:flex;align-items:center;gap:25px}
        .nav-link a{margin-left:22px;text-decoration:none;color:#3a3630;font-size:.95rem}
        .nav-link a:hover{color:#8b5a2b}
        .lang-switch{display:flex;gap:10px}
        .lang-btn{border:1px solid #ddd;padding:4px 10px;border-radius:4px;background:transparent;cursor:pointer}
        .lang-btn.active{background:#8b5a2b;color:#fff}
        .container{max-width:1100px;margin:60px auto;padding:0 20px}
        .page-title{text-align:center;font-size:2rem;color:#8b5a2b;margin-bottom:40px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px}
        .card{background:#fff;border-radius:8px;overflow:hidden;border:1px solid #eee}
        .card img{width:100%;height:220px;object-fit:cover}
        .card-body{padding:20px}
        .card-title{font-size:1.1rem;margin-bottom:8px}
        .card-desc{font-size:.9rem;color:#666;margin-bottom:12px}
        .btn{display:inline-block;background:#8b5a2b;color:#fff;padding:7px 16px;border-radius:4px;text-decoration:none;font-size:.9rem}
        .btn:hover{background:#704a22}
        footer{text-align:center;padding:30px;background:#f2eee8;margin-top:60px}
        .cn{display:block}
        .en{display:none}
        body.en .cn{display:none}
        body.en .en{display:block}
        @media(max-width:480px){.nav-link{display:none}}
    </style>
    <script>
        function switchLang(l){document.body.className=l;localStorage.lang=l}
        onload=()=>{if(localStorage.lang)switchLang(localStorage.lang)}
    </script>
</head>

<footer>© 2026 279993553.xyz</footer>

</html>
