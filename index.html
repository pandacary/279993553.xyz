<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iWatch 表带 | 高品质配件商城</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif}
:root {--main: #8c6a46; --bg: #f6f3ee; --card: #fff; --text: #4a443c; --light: #e4dfd7;}
body {background: var(--bg); color: var(--text); line-height: 1.7;}
nav {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky; top:0; z-index:99;
  border-bottom: 1px solid var(--light);
}
.logo {font-size: 18px; font-weight: 600; color: var(--main); text-decoration:none}
.nav-bar {display:flex;gap:18px;align-items:center}
.nav-bar a {color:var(--text); text-decoration:none; font-size:15px}
.lang {display:flex;gap:6px}
.lang button {padding:4px 10px; border:1px solid var(--light); border-radius:6px; background:transparent; cursor:pointer}
.lang button.active {background:var(--main); color:#fff}
.hero {padding:60px 20px; text-align:center; max-width:700px; margin:0 auto}
.hero h1 {font-size: 26px; color:var(--main); margin-bottom:12px}
.container {max-width:1000px; margin:0 auto; padding:20px}
.section {margin:40px 0}
h2.section-title {font-size:22px; color:var(--main); margin-bottom:24px; text-align:center}
.grid {display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:20px}
.card {background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--light)}
.card img {width:100%; height:180px; object-fit:cover}
.card-body {padding:16px}
.card-title {font-size:16px; margin-bottom:6px; color:var(--text)}
.btn {display:inline-block; margin-top:10px; padding:8px 14px; background:var(--main); color:#fff; border-radius:8px; text-decoration:none; font-size:14px}
.cn {display:block} .en {display:none} body.en .cn {display:none} body.en .en {display:block}
footer {text-align:center; padding:30px; font-size:14px; color:#888; border-top:1px solid var(--light); margin-top:40px}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">iWatch 表带</a>
  <div class="nav-bar">
    <a href="index.html"><span class="cn">首页</span><span class="en">Home</span></a>
    <a href="product.html"><span class="cn">全部产品</span><span class="en">Products</span></a>
    <a href="blog.html"><span class="cn">测评文章</span><span class="en">Blog</span></a>
    <div class="lang">
      <button class="active" onclick="setLang('cn')">中</button>
      <button onclick="setLang('en')">EN</button>
    </div>
  </div>
</nav>

<div class="hero">
  <h1><span class="cn">高品质 iWatch 表带</span><span class="en">Premium iWatch Bands</span></h1>
  <p><span class="cn">真皮 | 米兰尼斯 | 硅胶 | 编织 全品类优质表带</span><span class="en">Leather | Milanese | Silicone | Nylon</span></p>
</div>

<div class="container">
  <div class="section">
    <h2 class="section-title"><span class="cn">热门产品</span><span class="en">Hot Products</span></h2>
    <div class="grid" id="productList"></div>
  </div>

  <div class="section">
    <h2 class="section-title"><span class="cn">测评文章</span><span class="en">Latest Articles</span></h2>
    <div class="grid" id="blogList"></div>
  </div>
</div>

<footer>© iWatch 表带商城</footer>

<script>
function setLang(l){document.body.className=l; localStorage.lang=l}
onload=()=>{if(localStorage.lang)setLang(localStorage.lang)}

async function autoLoadProducts(){
  const files = ["products/product-01.html","products/product-02.html","products/product-03.html","products/product-04.html"]
  const p = document.getElementById("productList")
  for(let f of files){try{
    let t = await (await fetch(f)).text()
    let title = t.match(/<title>([\s\S]+?)<\/title>/)?.[1]||"产品"
    title=title.replace("| iWatch 表带商城","").trim()
    p.innerHTML+=`<div class="card"><img src="https://picsum.photos/seed=${f}/600/400"><div class="card-body"><div class="card-title">${title}</div><a href="${f}" class="btn"><span class="cn">查看</span><span class="en">View</span></a></div></div>`
  }catch(e){}}}

async function autoLoadBlog(){
  const files = ["articles/review-01.html","articles/review-02.html","articles/review-03.html"]
  const b = document.getElementById("blogList")
  for(let f of files){try{
    let t = await (await fetch(f)).text()
    let title = t.match(/<title>([\s\S]+?)<\/title>/)?.[1]||"文章"
    title=title.replace("| iWatch 表带商城","").trim()
    b.innerHTML+=`<div class="card"><img src="https://picsum.photos/seed=${f}/600/400"><div class="card-body"><div class="card-title">${title}</div><a href="${f}" class="btn"><span class="cn">阅读</span><span class="en">Read</span></a></div></div>`
  }catch(e){}}}

autoLoadProducts()
autoLoadBlog()
</script>
</body>
</html>
