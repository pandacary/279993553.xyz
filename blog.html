<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测评文章 | 279993553.xyz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft Yahei",sans-serif}
body{background:#f9f7f4;color:#3a3630;line-height:1.8}
nav{background-image:url('https://images.unsplash.com/photo-154178909411-f56ce539ca9a');background-size:cover;background-position:center;background-color:rgba(255,255,255,0.75);background-blend-mode:overlay;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999;border-bottom:1px solid #eee}
.logo{font-size:1.4rem;font-weight:600;color:#8b5a2b;text-decoration:none}
.nav-container{display:flex;align-items:center;gap:25px}
.nav-link a{text-decoration:none;color:#3a3630;margin-left:22px;font-size:.95rem}
.nav-link a:hover{color:#8b5a2b}
.lang-switch{display:flex;gap:10px}
.lang-btn{background:transparent;border:1px solid #ddd;padding:4px 10px;border-radius:4px;cursor-pointer;font-size:.85rem}
.lang-btn.active{background:#8b5a2b;color:#fff}
.container{max-width:900px;margin:60px auto;padding:0 20px}
.page-title{text-align:center;font-size:2rem;color:#8b5a2b;margin-bottom:40px}
.articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #eee}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:20px}
.card-title{font-size:1.1rem;margin-bottom:10px;color:#333}
.card-meta{font-size:.85rem;color:#999;margin-bottom:10px}
.btn{display:inline-block;background:#8b5a2b;color:#fff;padding:6px 14px;border-radius:4px;text-decoration:none;font-size:.9rem}
.btn:hover{background:#704a22}
.cn{display:block}
.en{display:none}
body.en .cn{display:none}
body.en .en{display:block}
footer{text-align:center;padding:30px;background:#f2eee8;color:#5a554e;margin-top:60px}
@media(max-width:768px){.nav-link a{margin-left:15px}}
@media(max-width:480px){.nav-link{display:none}}
</style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">279993553.xyz</a>
    <div class="nav-container">
        <div class="nav-link">
            <a href="index.html"><span class="cn">首页</span><span class="en">Home</span></a>
            <a href="product.html"><span class="cn">产品中心</span><span class="en">Products</span></a>
            <a href="blog.html"><span class="cn">测评文章</span><span class="en">Reviews</span></a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('cn')">中文</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="page-title">
        <span class="cn">产品测评文章</span>
        <span class="en">Product Reviews</span>
    </h2>
    <div class="articles" id="articleList"></div>
</div>

<footer>© 2026 279993553.xyz</footer>

<script>
function setLang(l){document.body.className=l;localStorage.lang=l}
onload=()=>{if(localStorage.lang)setLang(localStorage.lang)}

async function loadArticles(){
    const list = [
        "articles/review-01.html",
        "articles/review-02.html",
        "articles/review-03.html"
    ]
    const wrap = document.getElementById("articleList")
    for(let url of list){
        try{
            let r = await fetch(url)
            let t = await r.text()
            let title = t.match(/<title>([\s\S]+?)<\/title>/)?.[1] || "无标题文章"
            title = title.replace(" | 279993553.xyz","")
            wrap.innerHTML += `
            <div class="card">
                <img src="https://picsum.photos/seed/${url}/600/400">
                <div class="card-body">
                    <div class="card-title">${title}</div>
                    <a href="${url}" class="btn">
                        <span class="cn">阅读全文</span>
                        <span class="en">Read More</span>
                    </a>
                </div>
            </div>`
        }catch(e){}
    }
}
loadArticles()
</script>
</body>
</html>
